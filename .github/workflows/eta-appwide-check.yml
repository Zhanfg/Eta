name: ETA App-wide Design / Agent Regression

on:
  push:
    branches:
      - feature/eta-appwide-kelivo-practices
      - feature/eta-automation-vision-hardening
      - feature/eta-background-workspace
      - feature/eta-virtual-workspace-module
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eta-appwide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-ui-and-agent:
    name: Lint / Unit Tests / Debug Kotlin Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout complete ETA branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify original ETA LSPosed scope remains unchanged
        shell: bash
        run: bash scripts/verify_eta_original_lsposed_scopes.sh

      - name: Validate KSU-Magisk module preview scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in modules/eta-workspace/*.sh modules/eta-workspace/bin/*.sh; do
            sh -n "$script"
          done
          grep -qx 'id=eta_workspace' modules/eta-workspace/module.prop
          test ! -e modules/eta-workspace/sepolicy.rule
          test ! -d modules/eta-workspace/system

      - name: Compile host bridge and run peer-credential smoke tests
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            modules/eta-workspace/native/eta_workspace_bridge.c \
            -o /tmp/eta-workspace-bridge-host
          sudo python3 scripts/test_eta_workspace_bridge_native.py \
            /tmp/eta-workspace-bridge-host

      - name: Configure standard ETA Android toolchain
        uses: ./.github/actions/setup-build

      - name: Compile Android ARM64 workspace companion and package KSU/Magisk diagnostic module
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="$(sed -nE 's/^ndk = "([^"]+)"/\1/p' gradle/libs.versions.toml | head -n1)"
          test -n "$NDK_VERSION"
          sdkmanager --channel=3 "ndk;$NDK_VERSION"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          CC="$SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          test -x "$CC"
          BUILD_DIR="$RUNNER_TEMP/eta-workspace-module-package"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cp -a modules/eta-workspace/. "$BUILD_DIR/"
          "$CC" -std=c11 -O2 -Wall -Wextra -Werror \
            "$BUILD_DIR/native/eta_workspace_bridge.c" \
            -o "$BUILD_DIR/bin/eta-workspace-bridge"
          file "$BUILD_DIR/bin/eta-workspace-bridge" | grep -qi "aarch64"
          chmod 0755 "$BUILD_DIR/bin/eta-workspace-bridge"
          rm -rf "$BUILD_DIR/native"
          cd "$BUILD_DIR"
          zip -q -r "$GITHUB_WORKSPACE/eta-workspace-ipc-probe-arm64.zip" .
          unzip -l "$GITHUB_WORKSPACE/eta-workspace-ipc-probe-arm64.zip" |
            grep -q "bin/eta-workspace-bridge"

      - name: Publish diagnostic module archive (not a functional display backend)
        uses: actions/upload-artifact@v4
        with:
          name: eta-workspace-ipc-probe-arm64
          path: eta-workspace-ipc-probe-arm64.zip
          retention-days: 14

      - name: Verify whole-app UI and agent integration
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache --continue \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eta-appwide-regression-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

# This validates the app-wide Kotlin baseline, NOT a deployable WorkBuddy APK.
# The separate Go ARM64 integration workflow is mandatory for local WB.
