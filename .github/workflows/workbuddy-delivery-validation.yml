name: WorkBuddy delivery validation

on:
  push:
    branches: [test/workbuddy-delivery-validation-20261028]
  pull_request:
    branches: [release/eta-workbuddy-mvp-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbuddy-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate build script and adversarial ELF/APK fixtures
        run: |
          set -euo pipefail
          bash -n scripts/build_workbuddy_mvp.sh
          python3 -m unittest discover -s scripts/tests -v

  integrated-apk:
    needs: verifier-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - uses: ./.github/actions/setup-build
      - name: Install NDK for Bionic DNS
        run: sdkmanager 'ndk;30.0.16248370'
      - name: Test and build the exact 3.3.5 integrated APK
        run: bash scripts/build_workbuddy_mvp.sh
      - name: Upload only distributable binaries and redacted provenance
        uses: actions/upload-artifact@v4
        with:
          name: eta-workbuddy-3.3.5-validated-${{ github.run_id }}
          path: |
            build-mvp/Eta-v3.3.5-debug.apk
            build-mvp/ai-runtime-api.jar
            build-mvp/SHA256SUMS
            build-mvp/BUILD_PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
