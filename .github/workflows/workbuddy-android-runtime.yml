name: WorkBuddy Android runtime
on:
  push:
    branches: [fix/workbuddy-native-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbuddy-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - uses: ./.github/actions/setup-build
      - run: sdkmanager 'ndk;30.0.16248370'
      - name: Build isolated Android backend test app
        run: bash scripts/build_runtime_test.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual Android Keystore, Go lifecycle, Bionic DNS and TLS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g -Peta.nativeAbi=x86_64 -Peta.runtimeTests=true :app:connectedRuntimeTestAndroidTest
      # Do not upload vaults, synthetic account archives or raw process/logcat logs.
  arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - uses: ./.github/actions/setup-build
      - run: sdkmanager 'ndk;30.0.16248370'
      - name: Verify build validators
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build and verify Bionic ARM64 APK
        run: bash scripts/build_workbuddy_mvp.sh
      - uses: actions/upload-artifact@v4
        with:
          name: eta-3.3.5-bionic-${{ github.sha }}
          path: |
            build-mvp/Eta-v3.3.5-debug.apk
            build-mvp/ai-runtime-api.jar
            build-mvp/SHA256SUMS
            build-mvp/BUILD_PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
