name: WorkBuddy Android Core Feasibility

on:
  push:
    branches: [feature/workbuddy-native-integration, feature/eta-appwide-kelivo-practices, feature/eta-automation-vision-hardening, feature/eta-background-workspace, feature/eta-virtual-workspace-module]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wbcore-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-byte-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Download pinned official WorkBuddy release and verify every input byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wb-release"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/ithtelab/workbuddy-manager/releases/download/v2.9.0/workbuddy-manager-v2.9.0.tar.gz \
            -o "$RUNNER_TEMP/wb-release/release.tar.gz"
          printf '%s  %s\n' \
            '7f1a37b9bd9987c6210a41e58360e37658e71c4c305fbe85c64b25305bb7133e' \
            "$RUNNER_TEMP/wb-release/release.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wb-release/unpack"
          tar --no-same-owner -xzf "$RUNNER_TEMP/wb-release/release.tar.gz" -C "$RUNNER_TEMP/wb-release/unpack"
          mapfile -t candidates < <(find "$RUNNER_TEMP/wb-release/unpack" -type f -path '*/upstream/go.mod')
          if [[ "${#candidates[@]}" != 1 ]]; then
            echo "::error::Expected one embedded official Go upstream; found ${#candidates[@]}"
            exit 1
          fi
          echo "WB_UPSTREAM=$(dirname "${candidates[0]}")" >> "$GITHUB_ENV"
          test -f "$(dirname "${candidates[0]}")/LICENSE"
          test -f "$(dirname "${candidates[0]}")/cmd/server/main.go"
      - name: Go core host tests and all-package byte compilation
        shell: bash
        run: |
          set -euo pipefail
          cd "$WB_UPSTREAM"
          go mod verify
          go test ./internal/... ./cmd/server/...
          go build ./...
      - name: Exercise native Go HTTP path with zero-credential fixture
        shell: bash
        run: |
          set -euo pipefail
          cd "$WB_UPSTREAM"
          go build -o "$RUNNER_TEMP/wb-host-gateway" ./cmd/server
          mkdir -p "$RUNNER_TEMP/wb-fixture/auths" "$RUNNER_TEMP/wb-fixture/data"
          cat > "$RUNNER_TEMP/wb-fixture/config.json" <<EOF
          {
            "listen":"127.0.0.1:17863",
            "api_key":"fixture-only-please-never-use-in-production",
            "auth_dir":"$RUNNER_TEMP/wb-fixture/auths",
            "state_file":"$RUNNER_TEMP/wb-fixture/data/state.json",
            "schedule":{"checkin_enabled":false,"travel_enabled":false,
              "activity_enabled":false,"keepalive_enabled":false,
              "school_enabled":false,"cat_enabled":false},
            "metrics":{"enabled":false},
            "admin":{"enabled":false}
          }
          EOF
          "$RUNNER_TEMP/wb-host-gateway" -config "$RUNNER_TEMP/wb-fixture/config.json" \
            >"$RUNNER_TEMP/wb-fixture/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            code=$(curl -sS --max-time 1 -D "$RUNNER_TEMP/wb-fixture/health-headers.txt" \
              -o "$RUNNER_TEMP/wb-fixture/health.json" -w '%{http_code}' \
              http://127.0.0.1:17863/healthz || true)
            if [[ "$code" == 200 || "$code" == 503 ]]; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != 1 ]]; then echo "::error::Upstream process did not start"; exit 1; fi
          python3 -m json.tool "$RUNNER_TEMP/wb-fixture/health.json" >/dev/null
          grep -Eiq '^X-Service: workbuddy2api' "$RUNNER_TEMP/wb-fixture/health-headers.txt"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["service"]=="workbuddy2api"' \
            "$RUNNER_TEMP/wb-fixture/health.json"
          UNAUTH=$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:17863/v1/models)
          if [[ "$UNAUTH" != 401 && "$UNAUTH" != 403 ]]; then
            echo "::error::Unauthenticated model list returned $UNAUTH"; exit 1
          fi
          MODELS=$(curl -sS --max-time 10 \
            -H 'Authorization: Bearer fixture-only-please-never-use-in-production' \
            -o "$RUNNER_TEMP/wb-fixture/models.json" -w '%{http_code}' \
            http://127.0.0.1:17863/v1/models)
          if [[ "$MODELS" != 200 ]]; then
            echo "::error::Authenticated model listing returned $MODELS"; exit 1
          fi
          python3 -m json.tool "$RUNNER_TEMP/wb-fixture/models.json" >/dev/null
          # Test real Go auth-file parsing after restart. The credential is fake
          # and is NEVER sent to Tencent; do not probe /v1/models after insertion.
          # Exercise the same nested account/auth bytes written by ETA native importer.
          # Five synthetic nested account/auth records, matching the schema
          # of desktop accounts.zip. Never upload or use user-supplied tokens.
          # Inspect only local /status; no third-party authentication request.
          for index in 0 1 2 3 4; do
            realm="cn"
            if [[ "$index" == 4 ]]; then realm="global"; fi
            printf '{"account":{"uid":"local-byte-fixture-%s","nickname":"Synthetic%s","enterpriseId":""},"auth":{"accessToken":"fixture-no-login-%s","refreshToken":"fixture-refresh-disabled-%s","expiresAt":1825000000,"domain":"example.invalid","realm":"%s"}}\n' \
              "$index" "$index" "$index" "$index" "$realm" \
              > "$RUNNER_TEMP/wb-fixture/auths/workbuddy-00$index.json"
          done
          # Mobile import path explicitly restarts the native Go core.
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          "$RUNNER_TEMP/wb-host-gateway" -config "$RUNNER_TEMP/wb-fixture/config.json" \
            > "$RUNNER_TEMP/wb-fixture/restarted.log" 2>&1 &
          PID=$!
          loaded=0
          for attempt in $(seq 1 40); do
            curl -fsS --max-time 1 -H 'Authorization: Bearer fixture-only-please-never-use-in-production' \
              http://127.0.0.1:17863/status -o "$RUNNER_TEMP/wb-fixture/status.json"
            if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["total"]==5' \
              "$RUNNER_TEMP/wb-fixture/status.json" 2>/dev/null; then
              loaded=1; break
            fi
            sleep 0.25
          done
          if [[ "$loaded" != 1 ]]; then echo "::error::Go core did not load imported auth bytes after restart"; exit 1; fi
          echo "PASS: Go core boot + HTTP bytes + auth guard + JSON account bytes loaded at startup"
      - name: Cross-compile actual Go gateway for Android arm64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wb-native/arm64-v8a"
          (
            cd "$WB_UPSTREAM"
            GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' \
              -o "$RUNNER_TEMP/wb-native/arm64-v8a/workbuddy2api" ./cmd/server
          )
          target="$RUNNER_TEMP/wb-native/arm64-v8a/workbuddy2api"
          test -s "$target"
          file "$target" | tee "$RUNNER_TEMP/wb-native/file.txt"
          readelf -h "$target" | tee "$RUNNER_TEMP/wb-native/elf-header.txt"
          readelf -l "$target" | tee "$RUNNER_TEMP/wb-native/program-headers.txt"
          grep -Eq 'Machine:.*AArch64' "$RUNNER_TEMP/wb-native/elf-header.txt"
          grep -Eq 'Type:.*DYN' "$RUNNER_TEMP/wb-native/elf-header.txt"
          grep -q '/system/bin/linker64' "$RUNNER_TEMP/wb-native/program-headers.txt"
          sha256sum "$target" | tee "$RUNNER_TEMP/wb-native/SHA256SUMS"
      - name: Upload Android ELF feasibility evidence (not an installable APK)
        uses: actions/upload-artifact@v4
        with:
          name: wbcore-android-arm64-experimental
          path: ${{ runner.temp }}/wb-native/
          if-no-files-found: error
          retention-days: 14
      - name: Package verified Go ELF into ETA's Android native library slot
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/wb-native/arm64-v8a/workbuddy2api" \
            app/src/main/jniLibs/arm64-v8a/libwbcore.so
          sha256sum app/src/main/jniLibs/arm64-v8a/libwbcore.so
      - name: Set up ETA Gradle Android toolchain
        uses: ./.github/actions/setup-build
      - name: Build ETA Debug APK WITH embedded Go backend
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache \
            "-Peta.buildMetadata=${GITHUB_SHA::7}" \
            :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libwbcore.so'
          echo "Go upstream binary is physically embedded in this ETA APK"
      - name: Upload integrated ETA Debug APK (device validation still required)
        uses: actions/upload-artifact@v4
        with:
          name: eta-workbuddy-embedded-core-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
